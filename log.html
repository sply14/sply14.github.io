<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Brand Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=1795446213">
  <link rel="stylesheet" href="css/log.css?v=1795446213">
</head>
<body class="log">

  <!-- 로그인이 안 됐을 때 -->
  <section id="gate" class="gate" hidden>
    <h1>Brand Log</h1>
    <p>관리자 로그인이 필요합니다.</p>
    <a href="./admin.html">로그인하러 가기 →</a>
  </section>

  <div id="app" hidden>
    <header class="bar">
      <strong>Brand Log</strong>
      <span id="status" class="status" role="status"></span>
      <span class="spacer"></span>
      <button id="open-settings" type="button">설정</button>
      <a id="to-admin" href="./admin.html">카탈로그 편집 ↗</a>
    </header>

    <!-- 브랜드 레벨 -->
    <section id="level" class="lv" aria-live="polite"></section>

    <!-- 오늘의 기록 (평문 → AI → 확인 카드) -->
    <section id="entry" class="entry"></section>

    <!-- 최고 기록 -->
    <section id="records" class="records"></section>

    <!-- 연간 달력 -->
    <section class="year-wrap">
      <div class="year-head">
        <button id="prev-year" type="button" aria-label="이전 해">◀</button>
        <strong id="year-label"></strong>
        <button id="next-year" type="button" aria-label="다음 해">▶</button>
        <span id="year-sum" class="year-sum"></span>
      </div>
      <div id="year" class="year"></div>
    </section>
  </div>

  <!-- 날짜 상세 -->
  <dialog id="day" class="sheet"></dialog>

  <!-- 설정 -->
  <dialog id="settings" class="sheet"></dialog>

  <!-- 단계가 바뀔 때의 큰 축하 -->
  <div id="burst" class="burst" hidden></div>

  <script type="module" src="js/log.js?v=1795446213"></script>
</body>
</html>
