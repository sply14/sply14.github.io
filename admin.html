<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Catalog — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;1,400;1,700&family=Bodoni+Moda:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="css/style.css?v=1794897643">
  <link rel="stylesheet" href="css/admin.css?v=1794897643">
</head>
<body class="admin">

  <!-- 로그인 -->
  <form id="login" class="login" hidden>
    <h1>Admin</h1>
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in →</button>
    <p id="login-msg" class="msg" role="alert"></p>
  </form>

  <!-- 편집기 -->
  <div id="editor" hidden>
    <header class="bar">
      <strong>Catalog — Admin</strong>
      <span id="status" class="status" role="status"></span>
      <span class="spacer"></span>
      <button id="hidden-btn" type="button" hidden></button>
      <button id="pack" type="button" aria-pressed="true" title="켜면 모든 상품이 첫 칸부터 빈틈없이 채워집니다">빈칸 없이 채우기: 켬</button>
      <button id="add-text" type="button">+ 텍스트</button>
      <button id="add" type="button">+ 상품 추가</button>
      <a id="view" href="./" target="_blank" rel="noopener">사이트 보기 ↗</a>
      <button id="logout" type="button">로그아웃</button>
    </header>
    <p class="hint">드래그 = 이동 (채우기를 켜면 놓은 자리의 상품과 맞바꿈) · 네 모서리 = 크기 · 클릭 = 수정 · 빈 곳에서 끌기 또는 Shift/⌘+클릭 = 여러 개 선택 (선택한 것 중 하나를 끌면 함께 이동) · 이미지 파일을 원하는 칸에 끌어다 놓거나 빈 칸을 더블클릭 = 상품 추가</p>

    <div class="wrap">
      <main id="grid" class="grid edit"></main>
    </div>

    <section id="hidden-tray" class="tray" hidden>
      <div class="tray-head">
        <strong>숨긴 항목 <span id="h-count"></span></strong>
        <span class="tray-note">사이트에는 보이지 않습니다. 복구하면 그리드에 다시 놓입니다.</span>
        <button id="h-all" type="button">모두 복구</button>
      </div>
      <div id="h-list" class="h-list"></div>
    </section>

    <div id="multi" class="multi" hidden>
      <span id="m-count"></span>
      <button id="m-hide" type="button">숨기기</button>
      <button id="m-delete" type="button" class="danger">삭제</button>
      <button id="m-clear" type="button">선택 해제</button>
    </div>

    <aside id="panel" class="panel" hidden>
      <div class="panel-head">
        <strong id="p-size"></strong>
        <button id="p-close" type="button" aria-label="닫기">닫기 ×</button>
      </div>
      <form id="form" autocomplete="off">
        <div id="f-text" class="group">
          <label class="field"><span>텍스트</span><textarea name="label" rows="3" placeholder="chairs, stools and small armchairs"></textarea></label>
          <div class="field two">
            <label><span>폰트</span><select name="st_font"></select></label>
            <div class="toggles">
              <label class="toggle b" title="굵게"><input name="st_bold" type="checkbox"><span>B</span></label>
              <label class="toggle i" title="이탤릭"><input name="st_italic" type="checkbox"><span>I</span></label>
            </div>
          </div>
          <div class="field two">
            <div><span>정렬</span>
              <div class="toggles">
                <label class="toggle" title="왼쪽"><input name="st_align" type="radio" value="left"><span>좌</span></label>
                <label class="toggle" title="가운데"><input name="st_align" type="radio" value="center"><span>중</span></label>
                <label class="toggle" title="오른쪽"><input name="st_align" type="radio" value="right"><span>우</span></label>
              </div>
            </div>
            <div><span>글자 색</span>
              <div class="toggles">
                <input name="st_color" type="color" class="color" title="글자 색">
                <label class="toggle" title="속을 비우고 테두리만"><input name="st_outline" type="checkbox"><span class="ol">A</span></label>
              </div>
            </div>
          </div>
          <label class="field"><span>가로로 늘이기 / 누르기</span>
            <span class="range"><input name="st_sx" type="range" min="0.4" max="3" step="0.05"><output data-for="st_sx"></output></span>
          </label>
          <label class="field"><span>세로로 늘이기 / 누르기</span>
            <span class="range"><input name="st_sy" type="range" min="0.4" max="3" step="0.05"><output data-for="st_sy"></output></span>
          </label>
          <label class="field"><span>기울이기</span>
            <span class="range"><input name="st_skew" type="range" min="-30" max="30" step="1"><output data-for="st_skew"></output></span>
          </label>
        </div>
        <div id="f-product" class="group">
        <div class="p-image">
          <div id="p-crop" class="crop" title="끌어서 위치 이동 · 휠로 확대/축소"><img id="p-img" alt="" draggable="false"></div>
          <div class="p-image-actions">
            <button id="p-replace" type="button">사진 교체</button>
            <button id="p-reset" type="button">위치·크기 초기화</button>
          </div>
        </div>
        <div class="field">
          <span>상세 사진 <span class="sub">— 사진 여러 장을 이 패널에 끌어다 놓으면 한 번에 추가 (파일 이름 순)</span></span>
          <div id="p-details" class="p-details"></div>
        </div>
        <label class="field"><span>이름</span><input name="name"></label>
        <label class="field"><span>코드</span><input name="code" placeholder="예: FN-SG08"></label>
        <div class="field two">
          <label><span>가격 (원)</span><input name="price" type="number" min="0" step="1" inputmode="numeric"></label>
          <label class="check"><input name="sold" type="checkbox"><span>판매 완료</span></label>
        </div>
        <label class="field"><span>크기</span><input name="size" placeholder="W 577 × D 465 × H 657 mm"></label>
        <label class="field"><span>소재</span><input name="material"></label>
        <label class="field"><span>설명</span><textarea name="description" rows="4"></textarea></label>
        <label class="field"><span>구매 링크</span><input name="buy_url" placeholder="https://… 또는 mailto:…"></label>
        </div>
        <label class="field"><span id="scale-label">사진 확대</span>
          <span class="range"><input name="scale" type="range" min="0.5" max="4" step="0.01"><output id="scale-out"></output></span>
        </label>
        <div class="field two">
          <label><span>가로 칸</span><input name="w" type="number" min="1" max="10" step="1"></label>
          <label><span>세로 칸</span><input name="h" type="number" min="1" step="1"></label>
        </div>
        <button id="p-hide" type="button" class="soft">숨기기 — 사이트에서 빼두고 나중에 복구</button>
        <button id="p-delete" type="button" class="danger">상품 삭제</button>
      </form>
    </aside>
  </div>

  <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/avif" multiple hidden>
  <script type="module" src="js/admin.js?v=1794897643"></script>
</body>
</html>
